version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # 1. PostgreSQL with pgvector extension
  # ----------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: talentscout_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-talentscout_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-talentscout_password_here}
      POSTGRES_DB: ${POSTGRES_DB:-talentscout_ats}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-talentscout_user} -d ${POSTGRES_DB:-talentscout_ats}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - talentscout_net

  # ----------------------------------------------------------------------------
  # 2. Redis Cache & Celery Broker
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: talentscout_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - talentscout_net

  # ----------------------------------------------------------------------------
  # 3. MinIO S3-Compatible Object Storage
  # ----------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: talentscout_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - talentscout_net

  # ----------------------------------------------------------------------------
  # 4. Backend FastAPI API Server
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: talentscout_backend
    restart: unless-stopped
    environment:
      - ENVIRONMENT=development
      - DEBUG=True
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-talentscout_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-talentscout_password_here}
      - POSTGRES_DB=${POSTGRES_DB:-talentscout_ats}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-minioadmin}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - talentscout_net

  # ----------------------------------------------------------------------------
  # 5. Celery Asynchronous Pipeline Worker
  # ----------------------------------------------------------------------------
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: talentscout_celery_worker
    restart: unless-stopped
    command: celery -A app.workers.celery_app worker --loglevel=info
    environment:
      - ENVIRONMENT=development
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-talentscout_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-talentscout_password_here}
      - POSTGRES_DB=${POSTGRES_DB:-talentscout_ats}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-minioadmin}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-minioadmin}
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - talentscout_net

  # ----------------------------------------------------------------------------
  # 6. Frontend Next.js ATS Studio
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: talentscout_frontend
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000/api/v1
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - talentscout_net

networks:
  talentscout_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
